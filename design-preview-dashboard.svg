  </g>

  <text x="168" y="132" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750" fill="#9fb7be">Workspace</text>
  <text x="168" y="225" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" fill="#fff">Music rooms dashboard</text>
  <text x="168" y="290" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="650" fill="#c5d3d7">Create collaboration rooms and jump into synchronized project workspaces.</text>

  <g filter="url(#shadow)">
