  </g>
  <text x="196" y="381" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750" fill="#fff">Untitled Session</text>
  <text x="1339" y="367" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="850" fill="#111820">Create</text>
  <text x="1339" y="391" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="850" fill="#111820">room</text>

