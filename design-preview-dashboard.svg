    <circle cx="52" cy="198" r="24" fill="#d8f1f6"/><circle cx="88" cy="198" r="24" fill="#eef5f6"/><circle cx="124" cy="198" r="24" fill="#c8dce0"/>
    <text x="52" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850" fill="#13252b">ZZ</text>
    <text x="88" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850" fill="#13252b">FC</text>
    <text x="124" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="850" fill="#13252b">LM</text>
  </g>
