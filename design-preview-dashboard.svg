<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020707"/>
      <stop offset="0.45" stop-color="#071012"/>
      <stop offset="1" stop-color="#020606"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dceff4"/>
      <stop offset="0.5" stop-color="#aac9d3"/>
      <stop offset="1" stop-color="#81a9b8"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ab9c4"/>
      <stop offset="0.48" stop-color="#7fa4b2"/>
      <stop offset="1" stop-color="#678b99"/>
    </linearGradient>
    <linearGradient id="whitePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="0.58" stop-color="#dfe8e8"/>
      <stop offset="1" stop-color="#b9c9cb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect width="1536" height="900" fill="url(#bg)"/>
  <circle cx="1160" cy="220" r="380" fill="#7fa4b2" opacity="0.13"/>
  <circle cx="160" cy="760" r="320" fill="#7fa4b2" opacity="0.08"/>
  <g opacity="0.40" fill="#d5edf3">
